# The fork's version scheme.
#
# This file exists because the version block used to live in `app/build.gradle.kts`, and upstream
# rewrote it for its own 0.11.6 and 0.11.7 releases. A merge then took their side silently: no
# conflict, no error, and an APK that built as plain `0.11.7` while claiming to be upstream's build.
# The only symptom was a wrong artifact. Upstream has no reason to touch a file it does not know
# about, so nothing here can be merged away.
#
# DO NOT move these values back into `app/build.gradle.kts`.
#
# Scheme:  <fork>-dsh.<harness>      e.g. 0.2.0-dsh.0.1.6
#
#   fork     our own release count; moves when we cut a release.
#   harness  the harness line the app is FOR — a compatibility claim, not a counter. `0.1.6` means
#            "this build is for DSH 0.1.6". It must match the harness baseline upstream records for
#            this app line in `docs/COMPATIBILITY.md`; `scripts/release.sh` reads that table and
#            refuses to build when the two disagree.
#
# Never advance `harness` to track our own release number. That makes the name a lie in the one
# place a reader trusts it: someone on DSH 0.1.5 would install `0.2.0-dsh.0.1.7`, read "0.1.7" as
# the harness they need, and draw the wrong conclusion.
#
# `versionCode` is derived from `fork` ALONE. Upstream packs its semver into the same integer, so
# deriving ours from the full name would let a harness bump collide with a fork bump — two builds
# claiming one code, and Android refusing the upgrade.

forkVersion=0.2.0
harnessVersion=0.1.6

# The upstream app release this baseline was cut from. Informational: it documents what "harness
# 0.1.6" was read off, so the next person can check the claim rather than trust it.
upstreamAppVersion=0.11.7
